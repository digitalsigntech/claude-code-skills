# Drop-in for the local tier (LQ): /etc/systemd/system/voice-agent.service.d/lq.conf
# Every line is optional; local_voice.py --probe says what is missing.
[Service]
# --- recogniser (whisper.cpp) ---
Environment=LQ_WHISPER_BIN=/root/whisper.cpp/build/bin/whisper-cli
# CPU only: small (multilingual). With an accelerator: large-v3-turbo (see AGENT-INSTALL).
Environment=LQ_WHISPER_MODEL=/root/whisper.cpp/models/ggml-small.bin
# CPU only: English turns use small.en when present (same size, better on hard English).
Environment=LQ_WHISPER_MODEL_EN=/root/whisper.cpp/models/ggml-small.en.bin
# language ID for lang:"auto" — base, never tiny (Ukrainian → Russian)
Environment=LQ_WHISPER_DETECT_MODEL=/root/whisper.cpp/models/ggml-base.bin
# --- synthesisers ---
Environment=LQ_PIPER_BIN=/opt/voice-agent/venv/bin/piper
Environment=LQ_PIPER_VOICE=/opt/voice-agent/voices/en_US-lessac-medium.onnx
# printed by src/install_kokoro.sh:
Environment=LQ_KOKORO_SITE=/root/kokoro-venv/lib/python3.12/site-packages
Environment=LQ_KOKORO_MODEL=/root/kokoro/kokoro-v1.0.onnx
Environment=LQ_KOKORO_VOICES=/root/kokoro/voices-v1.0.bin
# --- reminders thumbnails minted in-process (the reflex needs the adapter's token map) ---
Environment=REMINDERS_MINT_MODULE=voice_agent
Environment=PYTHONPATH=/opt/voice-agent
